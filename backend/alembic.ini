[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL di-override dari environment variable DATABASE_URL di env.py
# Tapi tetap diisi default-nya di sini sebagai fallback
sqlalchemy.url = postgresql+asyncpg://prometheus:prometheus@127.0.0.1:5432/prometheus

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S